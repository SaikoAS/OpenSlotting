name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Check candidate version and release-tag consistency
        env:
          CANDIDATE_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          node --check tools/check-release.cjs
          node tools/check-release.cjs --commit "$CANDIDATE_COMMIT"

      - name: Check csv.js syntax
        run: node --check csv.js

      - name: Check coverage calendar syntax
        run: node --check src/ui/coverage-calendar.js

      - name: Check app.js syntax
        run: node --check app.js

      - name: Check encoding.js syntax
        run: node --check encoding.js

      - name: Check runtime and workspace syntax
        run: |
          node --check periods.js
          node --check runtime.js
          node --check workspace.js
          node --check storage.js
          node --check terminal.js
          node --check warehouse.js
          node --check warehouse-webgl.js
          node --check warehouse-scene.js
          node --check warehouse-editor.js
          node --check warehouse-analysis.js
          node --check src/application/workspace-preparation.js
          node --check src/application/worker-session.js
          node --check src/application/import-profile-batch.js
          node --check src/ui/import-profile-panel.js
          node --check src/ui/shared/windowed-dom.js
          node --check src/workers/workspace-worker.mjs

      - name: Check Python runtime availability and syntax
        run: |
          python3 --version
          python3 -c "import ast, pathlib; ast.parse(pathlib.Path('Start-OpenSlotting-Localhost.py').read_text(encoding='utf-8'))"

      - name: Run tests
        run: node --test tests/*.test.cjs

      - name: Test Windows launcher logic
        shell: pwsh
        run: ./tests/windows-launcher.test.ps1

      - name: Verify release packaging
        shell: pwsh
        env:
          CANDIDATE_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          ./tools/package-release.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'openslotting-release') -CandidateCommit $env:CANDIDATE_COMMIT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ./tools/check-release.cjs --commit $env:CANDIDATE_COMMIT --artifacts (Join-Path $env:RUNNER_TEMP 'openslotting-release')

  localhost-launcher:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Test localhost Windows launcher logic
        shell: pwsh
        run: |
          ./tests/windows-launcher.test.ps1
          ./tests/localhost-windows-launcher.test.ps1

      - name: Test launchers in Windows PowerShell 5.1
        shell: powershell
        run: |
          ./tests/windows-launcher.test.ps1
          ./tests/localhost-windows-launcher.test.ps1

      - name: Test candidate packaging on Windows
        shell: pwsh
        run: node --test tests/package-release.test.cjs tests/release-consistency.test.cjs

      - name: Test candidate packaging in Windows PowerShell 5.1
        shell: powershell
        env:
          OPENSLOTTING_PWSH: powershell.exe
        run: node --test tests/package-release.test.cjs
