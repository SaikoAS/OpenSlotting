name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Check csv.js syntax
        run: node --check csv.js

      - name: Check app.js syntax
        run: node --check app.js

      - name: Check encoding.js syntax
        run: node --check encoding.js

      - name: Run tests
        run: node --test tests/*.test.cjs

      - name: Verify release packaging
        shell: pwsh
        env:
          CANDIDATE_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: ./tools/package-release.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'openslotting-release') -CandidateCommit $env:CANDIDATE_COMMIT
